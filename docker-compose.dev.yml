networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_dev:

services:
  db:
    image: postgres:16-alpine
    container_name: pos-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_db_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_db_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  server:
    build:
      context: . # ← root, not ./server
      dockerfile: server/Dockerfile.dev
    container_name: pos-server-dev
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - ./packages:/app/packages
      - /app/server/node_modules
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      # Overrides DATABASE_URL from .env to point at the compose DB container
      DATABASE_URL: postgres://postgres:postgres@db:5432/pos_db_dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: . # ← root, not ./client
      dockerfile: client/Dockerfile.dev
    container_name: pos-client-dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - ./packages:/app/packages
      - /app/client/node_modules
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
    networks:
      - app-network
    depends_on:
      - server
    restart: unless-stopped
