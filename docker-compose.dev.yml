# version: "3.9"

networks:
  app-network:
    driver: bridge

services:
  server:
    build:
      context: . # ← root, not ./server
      dockerfile: server/Dockerfile.dev
    container_name: pos-server-dev
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - ./packages:/app/packages
      - /app/server/node_modules
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: . # ← root, not ./client
      dockerfile: client/Dockerfile.dev
    container_name: pos-client-dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - ./packages:/app/packages
      - /app/client/node_modules
    env_file:
      - ./client/.env
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    networks:
      - app-network
    depends_on:
      - server
    restart: unless-stopped
