networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    container_name: pos-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: pos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: always

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    container_name: pos-server-prod
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      # Override DATABASE_URL to point at the compose DB; set POSTGRES_PASSWORD in .env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/pos_db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    # No ports exposed externally — Caddy proxies /api/* to this container internally

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        # With Caddy as reverse proxy, /api is relative to the same origin
        VITE_API_URL: /api
    container_name: pos-client-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    restart: always
